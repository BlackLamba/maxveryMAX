<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF0F5" />
    <title>maxveryMAX — афиша города</title>
    <!-- MAX Bridge: внутри мессенджера даёт window.WebApp (initData, openLink, BackButton).
         Вне MAX скрипт просто не загрузится — utils/platform.ts работает и без него. -->
    <script defer src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      // Тема до первой отрисовки: ручной переключатель > тема хоста (prefers-color-scheme).
      (function () {
        var t = 'light';
        try {
          var saved = localStorage.getItem('mxm.theme');
          t = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
