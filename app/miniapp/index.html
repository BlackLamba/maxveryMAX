<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF0F5" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFB02E'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' text-anchor='middle' fill='%2314203A'%3EM%3C/text%3E%3C/svg%3E"
    />
    <title>maxveryMAX — афиша города</title>
    <!-- MAX Bridge: внутри мессенджера даёт window.WebApp (initData, openLink, BackButton).
         Вне MAX скрипт просто не загрузится — utils/platform.ts работает и без него. -->
    <script defer src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      // Тема до первой отрисовки: ручной переключатель > тема хоста (prefers-color-scheme).
      (function () {
        var t = 'light';
        try {
          var saved = localStorage.getItem('mxm.theme');
          t = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
