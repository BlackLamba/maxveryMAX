# Раздача сборки мини-аппа + прокси /api → backend:8000 (README 5.4).
# Внутри docker-сети compose backend доступен как http://backend:8000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # шрифты и статика — кэш (имена файлов версионируются сборкой Vite)
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # единая точка доступа к данным: только backend, никакого внешнего мира
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-fallback (роутер hash-based, но оставляем и для прямых заходов)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
